<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>声屿 Sonora · 音乐播放器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#f3efe8;
  --paper2:#eae4da;
  --card:#fffdf9;
  --ink:#171614;
  --muted:#7c756b;
  --faint:#aaa196;
  --line:rgba(23,22,20,.11);
  --accent:#b54833;
  --accent-soft:#eadcd3;
  --sb:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#0c0b0a;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font-family:inherit;color:inherit}
.hide{display:none!important}
img{display:block}
svg{display:block}

/* 登录：现场照片 + 底部账号面板 */
#login{position:fixed;inset:0;overflow:hidden;background:#0c0b0a}
#login video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.03);filter:saturate(.9) contrast(1.02)}
#login .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,7,6,.72) 0%,rgba(7,7,6,.18) 38%,rgba(7,7,6,.74) 72%,rgba(7,7,6,.94) 100%)}
#login .lg{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;padding:0}
#login .brand{position:absolute;left:24px;top:calc(30px + env(safe-area-inset-top));display:flex;align-items:center;gap:11px;color:#fff}
#login .brand .mk{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.5);
 background:rgba(0,0,0,.16);backdrop-filter:blur(6px);font-family:Georgia,serif;font-size:20px;line-height:1}
#login .brand h1{font-size:21px;letter-spacing:.02em;font-weight:650;line-height:1.2}
#login .brand small{display:block;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.62);margin-top:4px}
#login .card{width:100%;max-width:520px;margin:0 auto;background:var(--paper);color:var(--ink);
 border-radius:28px 28px 0 0;padding:24px 20px calc(18px + var(--sb));box-shadow:0 -24px 70px rgba(0,0,0,.28)}
#login .card .cap{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);margin-bottom:18px;letter-spacing:.04em}
#login .sw{display:flex;gap:3px;background:#e4ddd2;padding:3px;border-radius:11px;margin-bottom:18px}
#login .sw button{flex:1;border:0;background:transparent;color:#7a7166;font-size:12.5px;padding:8px 0;border-radius:8px;cursor:pointer;transition:.18s}
#login .sw button.on{background:var(--card);color:var(--ink);font-weight:650;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
.fld input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid #dcd3c6;
 background:#fffdfa;color:var(--ink);font-size:13.5px;outline:none;transition:.18s}
.fld input::placeholder{color:#b0a79a}
.fld input:focus{border-color:#8f8577;box-shadow:0 0 0 3px rgba(23,22,20,.06)}
.fld input.bad{border-color:#b54833}
.fld .err{display:block;color:#a33c2a;font-size:11px;margin-top:5px;min-height:0}
.capbox{display:flex;gap:9px;align-items:center}
.capbox input{flex:1}
#capImg{width:104px;height:40px;border-radius:8px;cursor:pointer;background:#fff;border:1px solid #e2d9cc}
#login .submit{width:100%;margin-top:8px;padding:13px;border:0;border-radius:11px;cursor:pointer;font-size:13.5px;letter-spacing:.08em;
 background:var(--ink);color:var(--paper);transition:.18s}
#login .submit:active{transform:translateY(1px)}
#login .tip{margin-top:14px;font-size:10.5px;line-height:1.8;color:var(--muted)}
#login .tip b{color:var(--ink);font-weight:600}
#login .credit{display:none}

/* 应用：无模拟边框，全屏原生 */
#app{position:fixed;inset:0;background:var(--paper)}
.scr{height:100%;display:flex;flex-direction:column;background:var(--paper)}
.view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;background:var(--paper);scrollbar-width:none;padding-bottom:10px}
.view::-webkit-scrollbar{display:none}
.pagehead{padding:calc(16px + env(safe-area-inset-top)) 20px 4px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.pagehead .date{font-size:10.5px;letter-spacing:.06em;color:var(--muted)}
.pagehead h1{font-size:27px;font-weight:720;letter-spacing:-.03em;line-height:1.1;margin-top:4px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;
 font-size:13px;font-weight:650;flex:0 0 auto;margin-top:3px}

.tabbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-around;background:rgba(243,239,232,.96);
 border-top:1px solid var(--line);padding:8px 6px calc(7px + var(--sb));backdrop-filter:blur(16px)}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
 font-size:9.5px;letter-spacing:.03em;color:#958d82;transition:.18s}
.tabbar button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--accent);font-weight:600}

.mini{position:relative;display:flex;align-items:center;gap:10px;margin:0 12px 5px;padding:6px 8px 6px 6px;
 border-radius:13px;background:var(--card);border:1px solid var(--line);overflow:hidden;cursor:pointer}
.mini img{width:38px;height:38px;border-radius:7px;object-fit:cover;flex:0 0 auto}
.mini .mg{flex:1;min-width:0}
.mini .mt{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mbtn{width:34px;height:34px;border:0;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:0 0 auto}
.mini .mbtn svg{width:17px;height:17px;fill:currentColor;stroke:none}
.mini .mline{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);width:0}

/* 首页 */
.feature{position:relative;margin:12px 16px 0;height:258px;border-radius:15px;overflow:hidden;background:#1b1917;cursor:pointer}
.feature img{width:100%;height:100%;object-fit:cover}
.feature .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02) 30%,rgba(0,0,0,.66) 100%)}
.feature .copy{position:absolute;left:18px;right:78px;bottom:17px;color:#fff}
.feature .copy .k{font-size:10px;letter-spacing:.12em;color:rgba(255,255,255,.66)}
.feature .copy h2{font-size:23px;line-height:1.22;font-weight:650;letter-spacing:-.02em;margin-top:7px}
.feature .copy p{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:6px}
.feature .fplay{position:absolute;right:16px;bottom:16px;width:46px;height:46px;border:0;border-radius:50%;
 background:rgba(250,247,241,.95);color:var(--ink);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px)}
.feature .fplay svg{width:18px;height:18px;fill:currentColor}
.feature-actions{display:flex;gap:9px;padding:13px 20px 0}
.pill{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 15px;font-size:11.5px;font-weight:600;cursor:pointer}
.pill.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;padding:26px 20px 7px}
.section-head h2{font-size:16px;font-weight:700;letter-spacing:-.01em}
.section-head .more{font-size:11px;color:var(--muted);cursor:pointer}

.track{display:flex;align-items:center;gap:13px;padding:8px 20px;cursor:pointer;transition:.15s}
.track:active{background:rgba(23,22,20,.045)}
.cover{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:#ddd5c9}
.track .grow{flex:1;min-width:0}
.track .mtitle{font-size:14px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .msub{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heartbtn{width:38px;height:38px;border:0;background:transparent;color:#aaa196;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.heartbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}
.heartbtn.on{color:var(--accent)}
.heartbtn.on svg{fill:var(--accent);stroke:var(--accent)}
.rank{width:22px;text-align:center;font-size:11px;color:var(--faint);flex:0 0 auto}
.empty{padding:44px 24px;text-align:center;color:#a39a8e;font-size:12px;line-height:1.9}
.editor-note{margin:26px 20px 10px;padding-top:16px;border-top:1px solid var(--line);font-size:10.5px;line-height:1.9;color:var(--muted)}

/* 搜索 */
.searchbar{display:flex;align-items:center;gap:9px;margin:10px 20px 4px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.searchbar svg{width:15px;height:15px;stroke:#8d8479;fill:none;stroke-width:1.7;flex:0 0 auto}
.searchbar input{flex:1;border:0;outline:none;font-size:13px;background:transparent}
.searchbar input::placeholder{color:#aaa196}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 20px 8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);font-size:11.5px;padding:7px 12px;border-radius:999px;cursor:pointer}
.chip:active{background:var(--accent-soft)}

/* 歌单 */
.plgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px 13px;padding:10px 20px 6px}
.plcard{cursor:pointer}
.plcard .art{position:relative;aspect-ratio:1/1;border-radius:11px;overflow:hidden;background:#d9d1c5}
.plcard .art img{width:100%;height:100%;object-fit:cover}
.plcard .art span{position:absolute;left:9px;bottom:9px;font-size:9.5px;color:#fff;background:rgba(0,0,0,.44);padding:3px 7px;border-radius:999px;backdrop-filter:blur(4px)}
.plcard .meta{padding-top:8px}
.plcard .meta b{font-size:13px;display:block;font-weight:600}
.plcard .meta i{font-style:normal;font-size:10.5px;color:var(--muted);display:block;margin-top:2px}

/* 歌单详情 */
.list-head{padding:calc(14px + env(safe-area-inset-top)) 20px 4px}
.list-head .back{border:0;background:transparent;font-size:12px;color:var(--muted);padding:0 0 14px;cursor:pointer}
.list-top{display:flex;gap:15px;align-items:flex-end}
.list-top img{width:94px;height:94px;border-radius:10px;object-fit:cover;flex:0 0 auto}
.list-top .lt{min-width:0;padding-bottom:2px}
.list-top .k{font-size:10px;color:var(--muted);letter-spacing:.06em}
.list-top h2{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1.2}
.list-top p{font-size:11px;color:var(--muted);margin-top:4px}
.list-actions{display:flex;gap:8px;flex-wrap:wrap;padding:16px 20px 2px}
.list-actions .pill{padding:7px 13px}
.list-actions .danger{color:#a33c2a}
.statrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 20px 4px}
.stat{border-top:1px solid var(--line);padding-top:10px}
.stat b{font-size:20px;display:block;font-weight:650}
.stat i{font-style:normal;font-size:10px;color:var(--muted);display:block;margin-top:3px}

/* 播放页 */
.player{position:relative;min-height:100%;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 22px calc(18px + var(--sb));
 display:flex;flex-direction:column;background-color:#0d0c0b;background-size:cover;background-position:center}
.player .ptop{display:flex;align-items:center;justify-content:space-between}
.player .ptop button{border:0;background:transparent;color:rgba(255,255,255,.76);cursor:pointer;padding:6px}
.player .ptop svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7}
.player .ptop span{font-size:10.5px;letter-spacing:.08em;color:rgba(255,255,255,.56)}
.player .part{width:min(250px,68vw);aspect-ratio:1/1;margin:24px auto 0;border-radius:12px;object-fit:cover;box-shadow:0 28px 60px rgba(0,0,0,.55)}
.player .pmeta{text-align:center;margin-top:24px}
.player .pmeta h2{font-size:22px;font-weight:650;letter-spacing:-.015em;line-height:1.2}
.player .pmeta p{font-size:11.5px;color:rgba(255,255,255,.56);margin-top:6px}
.progress{margin-top:22px}
.bar{height:2px;border-radius:2px;background:rgba(255,255,255,.2);position:relative;cursor:pointer}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#f4efe6;width:0}
.bar .dot{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;background:#f4efe6;transform:translate(-50%,-50%)}
.times{display:flex;justify-content:space-between;font-size:9.5px;color:rgba(255,255,255,.45);margin-top:8px;letter-spacing:.03em}
.ctrl{display:flex;align-items:center;justify-content:center;gap:30px;margin-top:16px}
.ctrl button{border:0;background:transparent;color:rgba(255,255,255,.86);cursor:pointer;display:grid;place-items:center;padding:4px}
.ctrl svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7}
.ctrl .main{width:58px;height:58px;border-radius:50%;background:#f4efe6;color:#171614}
.ctrl .main svg{width:23px;height:23px;stroke:none;fill:currentColor}
.volume{display:flex;align-items:center;gap:9px;margin-top:18px;color:rgba(255,255,255,.42);font-size:9.5px}
.volume input{flex:1;-webkit-appearance:none;height:2px;border-radius:2px;background:rgba(255,255,255,.2);outline:none}
.volume input::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#f4efe6}
.player-tools{display:flex;justify-content:space-between;gap:7px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.10)}
.player-tools button{border:0;background:transparent;color:rgba(255,255,255,.46);font-size:10px;cursor:pointer;padding:3px 0}
.player-tools button.on{color:#f4efe6}
.lyric{margin-top:16px;text-align:center;min-height:54px;overflow:hidden}
.lyric span{display:block;font-size:11.5px;line-height:1.95;color:rgba(255,255,255,.28);transition:.3s}
.lyric span.on{color:rgba(255,255,255,.88)}
.player .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.42);padding-top:14px}

/* 我的 */
.me{padding:calc(22px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;gap:15px}
.me .av{width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:20px;font-weight:650}
.me h2{font-size:23px;font-weight:700;letter-spacing:-.02em}
.me p{font-size:11px;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);padding:4px 20px 0}
.stats .stat{border-top:1px solid var(--line);padding-top:11px}
.stats .stat b{font-size:21px;font-weight:650;display:block}
.stats .stat i{font-style:normal;font-size:10px;color:var(--muted);display:block;margin-top:3px}
.account-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 20px 10px}
.account-actions .pill{text-align:center;padding:9px 8px}
.mine-note{padding:0 20px 24px;font-size:10px;color:var(--muted);line-height:1.9}

/* 浮层 */
.toast{position:fixed;left:50%;bottom:calc(95px + var(--sb));transform:translateX(-50%) translateY(8px);background:rgba(22,21,19,.94);color:#f7f2ea;
 font-size:11.5px;padding:9px 16px;border-radius:9px;opacity:0;pointer-events:none;transition:.25s;z-index:50;letter-spacing:.02em;max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,9,8,.44);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal.hide{display:none}
.sheet{width:100%;max-width:520px;background:var(--paper);color:var(--ink);border-radius:24px 24px 0 0;padding:20px 20px calc(18px + var(--sb));
 box-shadow:0 -20px 50px rgba(0,0,0,.18);max-height:86vh;overflow:auto}
.sheet h4{font-size:15px;font-weight:650;margin-bottom:14px}
.sheet input{width:100%;padding:11px 12px;border:1px solid #dcd3c6;background:#fffdfa;border-radius:9px;font-size:13px;outline:none;margin-bottom:11px}
.sheet input:focus{border-color:#8f8577}
.sheet label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.sheet .acts button{border:1px solid var(--line);border-radius:9px;padding:9px 17px;font-size:12px;cursor:pointer;background:transparent;color:var(--ink)}
.sheet .acts .ok{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:9px 15px;font-size:12px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent}


/* 兼容旧视图的通用区块 */
.sec{display:flex;align-items:baseline;justify-content:space-between;padding:26px 20px 7px}
.sec h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.sec .more{font-size:11px;color:var(--muted);cursor:pointer}
.list{padding:0}
.row{display:flex;align-items:center;gap:12px;padding:8px 20px}
.row .grow{flex:1;min-width:0}
.row .mtitle{font-size:14px;font-weight:600;line-height:1.35}
.row .msub{font-size:11px;color:var(--muted);margin-top:3px}
.avatar{border:0;cursor:pointer}

@media(min-width:700px){
 #app{max-width:560px;margin:0 auto;box-shadow:0 0 60px rgba(0,0,0,.12)}
}

</style>
</head>
<body>

<section id="login">
  <video src="assets/music_live.mp4" poster="assets/music_live.jpg" autoplay muted loop playsinline preload="auto"></video>
  <div class="scrim"></div>
  <div class="lg">
    <div class="brand">
      <div class="mk">S</div>
      <div><h1>声屿 Sonora</h1><small>音乐播放器</small></div>
    </div>
    <div class="card">
      <div class="cap"><span>账号登录</span><span>v1.0.1</span></div>
      <div class="sw">
        <button id="swLogin" class="on" onclick="switchTab('login')">账号登录</button>
        <button id="swReg" onclick="switchTab('reg')">新用户</button>
      </div>
      <form id="loginForm" onsubmit="return doLogin(event)">
        <label class="fld"><span>账号</span><input id="acc" autocomplete="username" placeholder="请输入登录账号"><em class="err" id="e-acc"></em></label>
        <label class="fld"><span>密码</span><input id="pwd" type="password" autocomplete="current-password" placeholder="6 位以上密码"><em class="err" id="e-pwd"></em></label>
        <label class="fld"><span>验证码</span>
          <div class="capbox"><input id="cap" maxlength="4" placeholder="右侧 4 位字符"><canvas id="capImg" width="104" height="40" onclick="drawCap()"></canvas></div>
          <em class="err" id="e-cap"></em></label>
        <button class="submit" type="submit" id="btnLogin">进入</button>
        <div class="tip">演示账号：<b>ty2024</b> / <b>music123</b><br>账号、密码或验证码错误都会被拦截</div>
      </form>
      <form id="regForm" class="hide" onsubmit="return doReg(event)">
        <label class="fld"><span>昵称</span><input id="r-name" placeholder="你的称呼"><em class="err" id="e-rname"></em></label>
        <label class="fld"><span>手机号</span><input id="r-tel" maxlength="11" placeholder="11 位手机号"><em class="err" id="e-rtel"></em></label>
        <label class="fld"><span>设置密码</span><input id="r-pwd" type="password" placeholder="6–16 位字母或数字"><em class="err" id="e-rpwd"></em></label>
        <label class="fld"><span>验证码</span>
          <div class="capbox"><input id="r-cap" maxlength="4" placeholder="右侧 4 位字符"><canvas id="capImg2" width="104" height="40" onclick="drawCap2()"></canvas></div>
          <em class="err" id="e-rcap"></em></label>
        <button class="submit" type="submit">注册并登录</button>
        <div class="tip">注册后自动创建「我的收藏」与「最近播放」，数据保存在本机。</div>
      </form>
    </div>
  </div>
</section>

<div id="app" class="hide">
  <div class="scr">
    <div class="view" id="view" data-page="rec"></div>
    <div class="mini hide" id="mini" onclick="go('player')"></div>
    <div class="tabbar" id="tabbar"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal hide" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ================= 数据 ================= */
const TONES=[['#7b5cf0','#b18cff'],['#0f93c8','#46c8e8'],['#e0663a','#f2a15c'],['#19a06a','#63f2b4'],['#5b6b8a','#96a6c4'],['#b8478f','#f07ac0'],['#2f6df6','#6fa8ff'],['#8a6d3b','#c9a469']];
const SONGS=[
 {id:'s1',art:'assets/covers/c1.jpg',t:'夜航西飞',a:'陈默与乐队',al:'夜航',len:60,g:0,hot:'city-pop'},
 {id:'s2',art:'assets/covers/c2.jpg',t:'晚风收音机',a:'林知夏',al:'收音机时代',len:60,g:1,hot:'民谣'},
 {id:'s3',art:'assets/covers/c3.jpg',t:'南方车站',a:'周野',al:'南站',len:60,g:2,hot:'indie'},
 {id:'s4',art:'assets/covers/c4.jpg',t:'未完成的夏天',a:'周末乐队',al:'夏日清单',len:60,g:3,hot:'流行'},
 {id:'s5',art:'assets/covers/c5.jpg',t:'城市潜水',a:'徐一鸣',al:'潜水',len:60,g:4,hot:'电子'},
 {id:'s6',art:'assets/covers/c6.jpg',t:'海湾公路',a:'阿岚',al:'公路电影',len:60,g:5,hot:'民谣'},
 {id:'s7',art:'assets/covers/c7.jpg',t:'凌晨三点半',a:'深夜电台',al:'午夜场',len:60,g:6,hot:'city-pop'},
 {id:'s8',art:'assets/covers/c8.jpg',t:'风马',a:'高原乐队',al:'风马',len:60,g:7,hot:'摇滚'}
];
const PLAYER=new Audio();PLAYER.preload='auto';PLAYER.volume=.62;
PLAYER.addEventListener('ended',()=>next(true));
PLAYER.addEventListener('error',()=>{PLAYER._err=true});
const LYRICS=[['夜色把城市调成静音','我在耳机里养了一片海','风穿过车窗的缝隙','像谁在耳边轻轻说话'],
 ['把晚风折进信封','寄给还没睡的你','收音机里飘着旧歌','我们都没长大'],
 ['南方的车站没有雪','只有潮湿的告别','最后一班车开走了','我还在原地等风'],
 ['夏天还没写完','我们就先散场','操场上的风很大','吹散了所有不勇敢']];
const LISTS=[{id:'p1',n:'深夜通勤',d:'通勤路上循环的歌',ids:['s7','s1','s5'],g:0},
 {id:'p2',n:'民谣夜话',d:'木吉他与旧故事',ids:['s2','s6'],g:2},
 {id:'p3',n:'周末歌单',d:'周五晚上的轻松感',ids:['s4','s3'],g:3}];
const HOTKW=['夜航西飞','民谣','city-pop','南方车站','深夜电台'];

/* ================= 状态 ================= */
const DBK='sonora_db_v2';
let S={tab:'rec',user:null,playing:null,paused:true,pos:0,list:'recommend',listId:null,shuffle:false,repeat:false,sleepAt:0,recent:[]};
let fav=[],plays=[],lists=[],users=[];
let store={users:[],data:{},last:null};
let U=null;
function save(){try{
 if(U)store.data[U.acc]={fav:fav,plays:plays.slice(0,40),lists:lists,recent:(S.recent||[]).slice(0,8)};
 store.users=users;store.last=U?U.acc:store.last;
 localStorage.setItem(DBK,JSON.stringify(store));
}catch(e){}sbPush();}
function switchUser(u){U=u;const d=store.data[u.acc]||{};
 fav=Array.isArray(d.fav)?d.fav:[];
 plays=Array.isArray(d.plays)?d.plays:[];
 lists=Array.isArray(d.lists)?d.lists:[];
 S.recent=Array.isArray(d.recent)?d.recent:[];}
function load(){try{
 const d=JSON.parse(localStorage.getItem(DBK)||'{}');
 if(Array.isArray(d.users)&&d.users.length){users=d.users;store.users=d.users}
 if(d.data&&typeof d.data==='object')store.data=d.data;
 if(d.last)store.last=d.last;
 if(!users.length){
  let old={};try{old=JSON.parse(localStorage.getItem('sonora_db_v1')||'{}')}catch(e){}
  users=Array.isArray(old.users)&&old.users.length?old.users:[{acc:'ty2024',pwd:'music123',name:'陶云',tel:'13800001234',created:'2026-08-01'}];
  store.data.ty2024={fav:Array.isArray(old.fav)&&old.fav.length?old.fav:['s1'],
   plays:Array.isArray(old.plays)&&old.plays.length?old.plays:['s1','s5','s7'],
   lists:Array.isArray(old.lists)&&old.lists.length?old.lists:JSON.parse(JSON.stringify(LISTS))};
  store.users=users;store.last='ty2024';
 }
}catch(e){}}
function cloneLists(){return JSON.parse(JSON.stringify(LISTS))}
const TABS=[['rec','推荐','<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>'],
 ['search','搜索','<circle cx="10.5" cy="10.5" r="6.4"/><path d="M15.4 15.4l5 5"/>'],
 ['pl','歌单','<path d="M4 6h16M4 12h16M4 18h9"/>'],
 ['mine','我的','<circle cx="12" cy="8" r="3.3"/><path d="M5 20c1.5-3.9 4-5.6 7-5.6s5.5 1.7 7 5.6"/>']];
const TITLES={rec:'推荐',search:'搜索',pl:'我的歌单',list:'歌单详情',player:'正在播放',mine:'我的'};

/* ================= 登录 ================= */
let capCode='',capCode2='';const CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function rc(){let s='';for(let i=0;i<4;i++)s+=CH[Math.floor(Math.random()*CH.length)];return s}
function draw(cv,code){const c=cv.getContext('2d'),w=cv.width,h=cv.height;c.clearRect(0,0,w,h);
 c.fillStyle='#f5f3fb';c.fillRect(0,0,w,h);
 for(let i=0;i<5;i++){c.strokeStyle='rgba(123,92,240,.25)';c.beginPath();c.moveTo(Math.random()*w,Math.random()*h);c.lineTo(Math.random()*w,Math.random()*h);c.stroke()}
 c.font='bold 22px Georgia,serif';c.textBaseline='middle';
 for(let i=0;i<4;i++){c.save();c.translate(14+i*23,h/2+(Math.random()*6-3));c.rotate((Math.random()*24-12)*Math.PI/180);
  c.fillStyle=['#5b39c9','#7b5cf0','#3f2e97','#8e63ff'][i%4];c.fillText(code[i],0,0);c.restore()}}
function drawCap(){capCode=rc();draw(document.getElementById('capImg'),capCode)}
function drawCap2(){capCode2=rc();draw(document.getElementById('capImg2'),capCode2)}
function switchTab(m){document.getElementById('loginForm').classList.toggle('hide',m!=='login');
 document.getElementById('regForm').classList.toggle('hide',m==='login');
 document.getElementById('swLogin').classList.toggle('on',m==='login');
 document.getElementById('swReg').classList.toggle('on',m!=='login');
 if(m!=='login')drawCap2()}
function err(id,m){document.getElementById(id).textContent=m||''}
function doLogin(e){e.preventDefault();
 ['e-acc','e-pwd','e-cap'].forEach(i=>err(i,''));
 const a=document.getElementById('acc'),p=document.getElementById('pwd'),c=document.getElementById('cap');
 let ok=true;
 if(!a.value.trim()){err('e-acc','请输入账号');ok=false}
 if(p.value.length<6){err('e-pwd','密码不少于 6 位');ok=false}
 if(c.value.trim().toUpperCase()!==capCode){err('e-cap','验证码不正确');ok=false}
 if(!ok){drawCap();c.value='';return false}
 const u=users.find(x=>x.acc===a.value.trim());
 if(!u){err('e-acc','账号不存在，请先注册');drawCap();c.value='';return false}
 if(u.pwd!==p.value){err('e-pwd','账号或密码错误');drawCap();c.value='';return false}
 localStorage.setItem('sonora_last_acc',u.acc);enter(u);return false}
function doReg(e){e.preventDefault();
 ['e-rname','e-rtel','e-rpwd','e-rcap'].forEach(i=>err(i,''));
 const n=document.getElementById('r-name'),t=document.getElementById('r-tel'),
 p=document.getElementById('r-pwd'),c=document.getElementById('r-cap');
 let ok=true;
 if(!n.value.trim()){err('e-rname','请输入昵称');ok=false}
 if(!/^1\d{10}$/.test(t.value.trim())){err('e-rtel','请输入 11 位手机号');ok=false}
 if(!/^[A-Za-z0-9]{6,16}$/.test(p.value)){err('e-rpwd','密码为 6–16 位字母或数字');ok=false}
 if(c.value.trim().toUpperCase()!==capCode2){err('e-rcap','验证码不正确');ok=false}
 if(!ok){drawCap2();c.value='';return false}
 const acc='u'+t.value.slice(-6);if(users.some(x=>x.acc===acc)){err('e-rname','该手机号已注册');return false}
 const u={acc:acc,pwd:p.value,name:n.value.trim(),tel:t.value.trim(),created:new Date().toISOString().slice(0,10)};
 users.push(u);store.data[acc]={fav:[],plays:[],lists:[]};save();enter(u);return false}
function enter(u){S.user=u;switchUser(u);document.getElementById('login').classList.add('hide');
 const app=document.getElementById('app');app.classList.remove('hide');
 document.querySelectorAll('#login video').forEach(v=>{try{v.pause()}catch(e){}});
 buildTabs();go('rec');toast('欢迎回来，'+u.name)}

/* ================= 框架 ================= */
function buildTabs(){const tb=document.getElementById('tabbar');
 tb.innerHTML=TABS.map(t=>'<button data-t="'+t[0]+'" onclick="go(\''+t[0]+'\')"><svg viewBox="0 0 24 24">'+t[2]+'</svg><span>'+t[1]+'</span></button>').join('')}
function syncMini(){
 const el=document.getElementById('mini');if(!el)return;
 if(!S.playing||S.tab==='player'){el.classList.add('hide');return}
 const s=findSong(S.playing);if(!s){el.classList.add('hide');return}
 const pct=s.len?((S.pos||0)/s.len*100):0;
 el.classList.remove('hide');
 el.innerHTML='<img src="'+s.art+'" alt=""><div class="mg"><div class="mt">'+s.t+'</div><div class="ms">'+s.a+' · '+s.al+'</div></div>'+
 '<button class="mbtn" onclick="event.stopPropagation();togglePlay()">'+(S.paused?'<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>')+'</button>'+
 '<div class="mline" id="mfill" style="width:'+pct+'%"></div>'
}
function go(t){S.tab=t;const v=document.getElementById('view');
 v.setAttribute('data-page',t);v.innerHTML=render(t);v.scrollTop=0;
 document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.t===t||(t==='list'&&b.dataset.t==='pl')));
 document.getElementById('tabbar').classList.toggle('hide',t==='player');
 if(t==='player')syncPlayer();syncMini()}
function findSong(id){return SONGS.find(s=>s.id===id)}
function coverEl(s,size){return '<img class="cover" src="'+s.art+'" style="width:'+size+'px;height:'+size+'px" alt="">'}
function fmt(n){const m=Math.floor(n/60),s=Math.floor(n%60);return m+':'+String(s).padStart(2,'0')}
function dateLabel(){const d=new Date(),w='日一二三四五六'[d.getDay()];return (d.getMonth()+1)+'月'+d.getDate()+'日 · 周'+w}
function greet(){const h=new Date().getHours();return h<5?'夜深了':h<11?'早上好':h<14?'中午好':h<18?'下午好':'晚上好'}

/* ================= 视图 ================= */
function render(t){
 if(t==='rec')return vRec();if(t==='search')return vSearch();if(t==='pl')return vPlaylists();
 if(t==='list')return vList();if(t==='player')return vPlayer();return vMine()}
function vRec(){
 const lead=SONGS[0],picks=SONGS.slice(0,4),fresh=SONGS.slice(4,8);
 const nm=S.user?S.user.name:'';
 return '<div class="pagehead"><div><div class="date">'+dateLabel()+'</div><h1>'+greet()+(nm?'，'+nm:'')+'</h1></div>'+
 '<button class="avatar" onclick="go(\'mine\')">'+(nm?nm.slice(0,1):'S')+'</button></div>'+
 '<div class="feature" onclick="playIt(\''+lead.id+'\')"><img src="'+lead.art+'" alt=""><div class="shade"></div>'+
 '<div class="copy"><div class="k">今日精选</div><h2>'+lead.t+'</h2><p>'+lead.a+' · 共 '+SONGS.length+' 首</p></div>'+
 '<button class="fplay" onclick="event.stopPropagation();playIt(\''+lead.id+'\')"><svg viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12z"/></svg></button></div>'+
 '<div class="feature-actions"><button class="pill dark" onclick="playIt(\'s1\')">播放今日精选</button>'+
 '<button class="pill" onclick="go(\'pl\')">我的歌单</button></div>'+
 '<div class="section-head"><h2>为你挑选</h2><span class="more" onclick="go(\'search\')">全部曲库</span></div>'+
 '<div>'+picks.map(s=>rowHtml(s,false)).join('')+'</div>'+
 '<div class="section-head"><h2>新近收录</h2><span class="more">'+SONGS.length+' 首</span></div>'+
 '<div>'+fresh.map(s=>rowHtml(s,false)).join('')+'</div>'+
 '<div class="editor-note">全部音频与封面都随安装包内置，离线也能播放。点歌曲任意位置开始播放，心形按钮用来收藏。</div>'}
function rowHtml(s,showCover,rank){
 const h='<svg viewBox="0 0 24 24"><path d="M12 20.2S4.8 15.6 4.8 10.6A4 4 0 0 1 12 8.4a4 4 0 0 1 7.2 2.2c0 5-7.2 9.6-7.2 9.6z"/></svg>';
 return '<div class="track" onclick="playIt(\''+s.id+'\')">'+
 (rank?'<span class="rank">'+rank+'</span>':'')+coverEl(s,52)+
 '<div class="grow"><div class="mtitle">'+s.t+'</div><div class="msub">'+s.a+' · '+s.al+'</div></div>'+
 '<button class="heartbtn '+(fav.includes(s.id)?'on':'')+'" onclick="event.stopPropagation();toggleFav(\''+s.id+'\')">'+h+'</button></div>'}

function vSearch(){
 const q=(S.q||'').trim().toLowerCase();
 const res=q?SONGS.filter(s=>(s.t+s.a+s.al+s.hot).toLowerCase().includes(q)):[];
 return '<div class="pagehead"><div><div class="date">歌手、专辑或关键词</div><h1>搜索</h1></div></div>'+
 '<div class="searchbar"><svg viewBox="0 0 24 24"><circle cx="10.6" cy="10.6" r="6.4"/><path d="M15.4 15.4l5 5"/></svg>'+
 '<input id="q" value="'+(S.q||'')+'" placeholder="搜索歌曲、歌手、专辑" oninput="onSearch(this.value)"></div>'+
 '<div class="sec"><h3>最近搜索</h3><span class="more" style="cursor:pointer" onclick="S.recent=[];save();go(\'search\')">清空</span></div>'+
 '<div class="chips">'+(S.recent.length?S.recent.map(k=>'<span class="chip" onclick="setQ(\''+k+'\')">'+k+'</span>').join(''):'<span style="font-size:11px;color:#a8a4bd;padding:0 2px">还没有搜索记录</span>')+'</div>'+
 '<div class="sec"><h3>热搜</h3><span class="more">实时</span></div>'+
 '<div class="chips">'+HOTKW.map(k=>'<span class="chip" onclick="setQ(\''+k+'\')">'+k+'</span>').join('')+'</div>'+
 (q?('<div class="sec"><h3>搜索结果 · '+res.length+' 首</h3></div>'+(res.length?'<div class="list">'+res.map(s=>rowHtml(s,true)).join('')+'</div>':'<div class="empty">没有找到相关歌曲<br>换个关键词试试</div>'))
 :'<div class="sec"><h3>最近播放</h3><span class="more">'+plays.length+' 条</span></div>'+
   '<div class="list">'+(plays.length?plays.slice(0,4).map(id=>{const s=findSong(id);return s?rowHtml(s,true):''}).join(''):'<div class="empty">还没有播放记录</div>')+'</div>'+
   '<div class="sec"><h3>全部曲库</h3><span class="more">'+SONGS.length+' 首</span></div>'+
   '<div class="list">'+SONGS.map(s=>rowHtml(s,true)).join('')+'</div>')}
function onSearch(v){S.q=v;const box=document.getElementById('view');const st=box.scrollTop;box.innerHTML=vSearch();box.scrollTop=st;
 const i=document.getElementById('q');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
function setQ(k){S.q=k;pushRecent(k);go('search')}
function pushRecent(k){k=(k||'').trim();if(!k)return;S.recent=[k].concat(S.recent.filter(x=>x!==k)).slice(0,6);save()}
function vPlaylists(){
 const total=lists.reduce((a,b)=>a+b.ids.length,0);
 return '<div class="pagehead"><div><div class="date">收藏与整理</div><h1>歌单</h1></div>'+
 '<button class="avatar" onclick="newList()">+</button></div>'+
 '<div class="stats"><div class="stat"><b>'+lists.length+'</b><i>个歌单</i></div>'+
 '<div class="stat"><b>'+total+'</b><i>首歌曲</i></div>'+
 '<div class="stat"><b>'+fav.length+'</b><i>首收藏</i></div></div>'+
 '<div class="feature-actions"><button class="pill dark" onclick="newList()">新建歌单</button>'+
 '<button class="pill" onclick="go(\'search\')">去找歌</button></div>'+
 '<div class="section-head"><h2>我的歌单</h2><span class="more">数据保存在本机</span></div>'+
 (lists.length?'<div class="plgrid">'+lists.map(l=>{
  const art=l.ids.length?findSong(l.ids[0]).art:SONGS[0].art;
  return '<div class="plcard" onclick="openListFull(\''+l.id+'\')"><div class="art"><img src="'+art+'" alt=""><span>'+l.ids.length+' 首</span></div>'+
  '<div class="meta"><b>'+l.n+'</b><i>'+l.d+'</i></div></div>'}).join('')+'</div>'
  :'<div class="empty">还没有歌单<br>点右上角「+」新建一个</div>')+
 '<div class="section-head"><h2>按场景生成</h2><span class="more">一次四首</span></div>'+
 '<div class="chips">'+['深夜通勤','周五下班','雨天室内','跑步热身'].map(n=>
  '<button class="chip" onclick="quickList(\''+n+'\')">'+n+'</button>').join('')+'</div>'+
 '<div class="editor-note">歌单只保存在这台设备；换设备登录后，收藏和播放记录可以重新整理。</div>'}
function quickList(n){if(lists.some(l=>l.n===n)){toast('已有同名歌单');return}
 const pick=SONGS.slice(lists.length%4,lists.length%4+4).map(s=>s.id);
 lists.unshift({id:'p'+Date.now(),n:n,d:'场景生成 · '+pick.length+' 首',ids:pick,g:lists.length%TONES.length});
 save();go('pl');toast('已生成歌单：'+n)}
function newList(){
 openSheet('<h4>新建歌单</h4><input id="nl" placeholder="歌单名称，如 深夜通勤" maxlength="12">'+
 '<div class="acts"><button onclick="closeSheet()">取消</button><button class="ok" onclick="doNewList()">创建</button></div>')}
function doNewList(){const v=document.getElementById('nl').value.trim();
 if(!v){toast('请填写歌单名称');return}
 lists.unshift({id:'p'+Date.now(),n:v,d:'新建歌单 · 0 首',ids:[],g:lists.length%TONES.length});
 save();closeSheet();go('pl');toast('歌单已创建')}
function openList(id){const l=lists.find(x=>x.id===id);if(!l)return;
 const ss=l.ids.map(findSong).filter(Boolean);
 openSheet('<h4>'+l.n+' · '+ss.length+' 首</h4>'+
 (ss.length?ss.map(s=>'<div class="row" style="padding:8px 0" onclick="closeSheet();playIt(\''+s.id+'\')">'+coverEl(s,38)+
  '<div class="grow"><div class="mtitle">'+s.t+'</div><div class="msub">'+s.a+'</div></div></div>').join(''):'<div class="empty" style="padding:24px 0">还没有歌曲</div>')+
 '<div class="acts" style="margin-top:8px"><button onclick="delList(\''+id+'\')">删除歌单</button><button class="ok" onclick="closeSheet()">关闭</button></div>')}
function delList(id){lists=lists.filter(l=>l.id!==id);save();closeSheet();go('pl');toast('歌单已删除')}
function openListFull(id){S.listId=id;S.tab='list';go('list')}
function vList(){
 const l=lists.find(x=>x.id===S.listId);
 if(!l)return '<div class="empty">歌单不存在或已删除<br><span style="color:var(--accent)" onclick="go(\'pl\')">返回歌单</span></div>';
 const ss=l.ids.map(findSong).filter(Boolean);
 const art=ss.length?ss[0].art:SONGS[0].art;
 return '<div class="list-head"><button class="back" onclick="go(\'pl\')">‹ 返回歌单</button>'+
 '<div class="list-top"><img src="'+art+'" alt=""><div class="lt"><div class="k">我的歌单 · '+ss.length+' 首</div>'+
 '<h2>'+l.n+'</h2><p>'+l.d+'</p></div></div></div>'+
 '<div class="list-actions"><button class="pill dark" onclick="playList(\''+l.id+'\')">播放全部</button>'+
 '<button class="pill" onclick="renameList(\''+l.id+'\')">重命名</button>'+
 '<button class="pill danger" onclick="delList2(\''+l.id+'\')">删除</button></div>'+
 '<div class="section-head"><h2>歌单内容</h2><span class="more" onclick="addSongSheet(\''+l.id+'\')">添加歌曲</span></div>'+
 (ss.length?'<div class="list">'+ss.map(s=>'<div class="row"><div onclick="playIt(\''+s.id+'\')" style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">'+
   coverEl(s,46)+'<div class="grow"><div class="mtitle">'+s.t+'</div><div class="msub">'+s.a+' · '+fmt(s.len)+'</div></div></div>'+
   '<button class="chip" onclick="rmFromList(\''+l.id+'\',\''+s.id+'\')">移出</button></div>').join('')+'</div>'
  :'<div class="empty">这个歌单还是空的<br>点「添加歌曲」挑几首</div>')+
 '<div class="statrow"><div class="stat"><b>'+Math.round(ss.reduce((a,b)=>a+b.len,0)/60)+'</b><i>总时长（分钟）</i></div>'+
 '<div class="stat"><b>'+ss.filter(x=>plays.includes(x.id)).length+'</b><i>已听过的歌</i></div></div>'+
 '<div class="section-head"><h2>从曲库补充</h2><span class="more">按歌单气质挑</span></div>'+
 '<div class="chips">'+SONGS.filter(x=>!l.ids.includes(x.id)).slice(0,4).map(x=>
  '<button class="chip" onclick="addSong(\''+l.id+'\',\''+x.id+'\');go(\'list\')">+ '+x.t+'</button>').join('')+'</div>'+
 '<div class="editor-note">歌单改动会即时保存；移出歌曲不会删掉收藏，播放记录仍会累计。</div>'}
function playList(id){const l=lists.find(x=>x.id===id);if(!l||!l.ids.length){toast('歌单里还没有歌曲');return}
 S.queue=l.ids.slice();playIt(l.ids[0])}
function rmFromList(lid,sid){const l=lists.find(x=>x.id===lid);if(!l)return;
 l.ids=l.ids.filter(x=>x!==sid);l.d=l.ids.length?l.d:'空歌单';
 save();go('list');toast('已移出歌单')}
function renameList(id){const l=lists.find(x=>x.id===id);if(!l)return;
 openSheet('<h4>重命名歌单</h4><input id="rn" value="'+l.n+'" maxlength="12">'+
 '<label>简介<input id="rd" value="'+l.d+'" maxlength="24"></label>'+
 '<div class="acts"><button onclick="closeSheet()">取消</button><button class="ok" onclick="doRename(\''+id+'\')">保存</button></div>')}
function doRename(id){const l=lists.find(x=>x.id===id);const n=document.getElementById('rn').value.trim(),
 d=document.getElementById('rd').value.trim();
 if(!n){toast('名称不能为空');return}
 l.n=n;l.d=d||l.d;save();closeSheet();go('list');toast('歌单已更新')}
function delList2(id){openSheet('<h4>删除歌单</h4><div style="font-size:12px;color:#8b86a3;line-height:1.9">只会删除歌单，不影响收藏与播放记录。</div>'+
 '<div class="acts"><button onclick="closeSheet()">取消</button><button class="ok" onclick="doDelList(\''+id+'\')">确认删除</button></div>')}
function doDelList(id){lists=lists.filter(x=>x.id!==id);save();closeSheet();S.listId=null;go('pl');toast('歌单已删除')}
function addSongSheet(lid){const l=lists.find(x=>x.id===lid);if(!l)return;
 openSheet('<h4>添加歌曲 · '+l.n+'</h4><div style="max-height:300px;overflow:auto">'+SONGS.map(s=>
 '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(0,0,0,.06)">'+
 coverEl(s,34)+'<div style="flex:1;min-width:0"><div class="mtitle">'+s.t+'</div><div class="msub">'+s.a+'</div></div>'+
 (l.ids.includes(s.id)?'<button class="chip" style="opacity:.6" onclick="rmFromList(\''+lid+'\',\''+s.id+'\');addSongSheet(\''+lid+'\')">已在</button>'
  :'<button class="chip" onclick="addSong(\''+lid+'\',\''+s.id+'\')">加入</button>')+'</div>').join('')+'</div>'+
 '<div class="acts" style="margin-top:10px"><button class="ok" onclick="closeSheet()">完成</button></div>')}
function addSong(lid,sid){const l=lists.find(x=>x.id===lid);if(!l)return;
 if(l.ids.includes(sid)){toast('已经在歌单里');return}
 l.ids.push(sid);save();toast('已加入「'+l.n+'」')}
function songMenu(id){const s=findSong(id);if(!s)return;
 openSheet('<h4>'+s.t+'</h4><div style="font-size:11.5px;color:#8b86a3;margin:-8px 0 14px">'+s.a+' · '+s.al+' · '+fmt(s.len)+'</div>'+
 '<button class="btn" style="width:100%;margin-bottom:8px" onclick="closeSheet();playIt(\''+id+'\')">▶ 播放这首</button>'+
 '<button class="btn" style="width:100%;margin-bottom:8px" onclick="toggleFav(\''+id+'\');closeSheet()">'+(fav.includes(id)?'♥ 取消收藏':'♡ 加入收藏')+'</button>'+
 '<div style="font-size:10.5px;color:#9a97ad;margin:12px 0 6px">加入歌单</div>'+
 (lists.length?lists.map(l=>'<button class="btn" style="width:100%;margin-bottom:6px" onclick="addSong(\''+l.id+'\',\''+id+'\');closeSheet()">'+l.n+' · '+l.ids.length+' 首</button>').join(''):'<div style="font-size:11px;color:#9a97ad">还没有歌单，先去「歌单」建一个</div>')+
 '<div class="acts" style="margin-top:12px"><button onclick="closeSheet()">关闭</button></div>')}
function vPlayer(){
 const s=S.playing?findSong(S.playing):SONGS[0];
 const pct=(S.pos||0)/s.len*100;
 const lineIdx=Math.min(3,Math.floor((S.pos||0)/(s.len/4)));
 const bg="background-image:linear-gradient(180deg,rgba(10,9,8,.48) 0%,rgba(10,9,8,.82) 38%,rgba(11,10,9,.98) 78%),url('"+s.art+"')";
 return '<div class="player" style="'+bg+'">'+

 '<img class="part" src="'+s.art+'" alt="">'+
 '<div class="pmeta"><h2>'+s.t+'</h2><p>'+s.a+' · '+s.al+'</p></div>'+
 '<div class="progress"><div class="bar" id="bar" onclick="seek(event)"><div class="fill" id="fill" style="width:'+pct+'%"></div>'+
 '<div class="dot" id="pdot" style="left:'+pct+'%"></div></div>'+
 '<div class="times"><span id="tcur">'+fmt(S.pos||0)+'</span><span id="tall">'+fmt(s.len)+'</span></div></div>'+
 '<div class="ctrl"><button onclick="prev()"><svg viewBox="0 0 24 24"><path d="M7 5v14M18 5l-9 7 9 7z"/></svg></button>'+
 '<button class="main" onclick="togglePlay()" id="mainBtn">'+(S.paused?'<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>')+'</button>'+
 '<button onclick="next()"><svg viewBox="0 0 24 24"><path d="M17 5v14M6 5l9 7-9 7z"/></svg></button></div>'+
 '<div class="player-tools"><button class="'+(S.shuffle?'on':'')+'" onclick="S.shuffle=!S.shuffle;refreshPlayer();toast(S.shuffle?\'随机播放已开\':\'随机播放已关\')">随机</button>'+
 '<button class="'+(S.repeat?'on':'')+'" onclick="S.repeat=!S.repeat;refreshPlayer();toast(S.repeat?\'单曲循环已开\':\'单曲循环已关\')">单曲循环</button>'+
 '<button class="'+(S.sleepAt?'on':'')+'" onclick="sleepTimer()">'+(S.sleepAt?'定时 '+Math.max(0,Math.round((S.sleepAt-Date.now())/60000))+' 分':'定时关闭')+'</button></div>'+
 '<div class="volume"><span>音量</span><input type="range" min="0" max="100" value="'+Math.round((PLAYER.volume||.62)*100)+'" oninput="setVol(this.value)"><span id="volTxt">'+Math.round((PLAYER.volume||.62)*100)+'</span></div>'+
 '<div class="lyric">'+LYRICS[s.g%LYRICS.length].map((l,i)=>'<span class="'+(i===lineIdx?'on':'')+'">'+l+'</span>').join('')+'</div>'+
 '<div class="foot"><span onclick="addToSheet(\''+s.id+'\')" style="cursor:pointer">加入歌单</span><span onclick="toggleFav(\''+s.id+'\');refreshPlayer()" style="cursor:pointer">'+(fav.includes(s.id)?'已收藏':'收藏这首')+'</span></div></div>'}
function addToSheet(sid){const s=findSong(sid);
 openSheet('<h4>加入歌单 · '+s.t+'</h4>'+
 (lists.length?lists.map(l=>'<button class="btn" style="width:100%;margin-bottom:8px" onclick="addSong(\''+l.id+'\',\''+sid+'\');closeSheet()">'+l.n+' · '+l.ids.length+' 首</button>').join(''):'<div style="font-size:11.5px;color:#8b86a3">还没有歌单，先去「歌单」新建</div>')+
 '<div class="acts" style="margin-top:10px"><button onclick="closeSheet()">关闭</button></div>')}
function sleepTimer(){
 if(S.sleepAt){S.sleepAt=0;refreshPlayer();toast('定时关闭已取消');return}
 openSheet('<h4>定时关闭</h4><div style="display:flex;gap:8px;flex-wrap:wrap">'+
 [15,30,60,90].map(m=>'<button class="chip" onclick="setSleep('+m+')">'+m+' 分钟后</button>').join('')+'</div>'+
 '<div class="acts" style="margin-top:12px"><button onclick="closeSheet()">取消</button></div>')}
function setSleep(m){S.sleepAt=Date.now()+m*60000;closeSheet();refreshPlayer();toast(m+' 分钟后自动暂停')}
function vMine(){
 return '<div class="me"><div class="av">'+(S.user?S.user.name.slice(0,1):'听')+'</div>'+
 '<div><h2>'+(S.user?S.user.name:'未登录')+'</h2><p>'+(S.user?('账号 '+S.user.acc):'')+'</p></div></div>'+
 '<div class="stats"><div class="stat"><b>'+fav.length+'</b><i>收藏</i></div>'+
 '<div class="stat"><b>'+plays.length+'</b><i>播放次数</i></div>'+
 '<div class="stat"><b>'+lists.length+'</b><i>歌单</i></div></div>'+
 '<div class="sec"><h3>最近播放</h3><span class="more" onclick="clearPlays()">清空</span></div>'+
 '<div class="list">'+(plays.length?plays.slice(0,4).map(id=>{const s=findSong(id);return s?rowHtml(s,true):''}).join(''):'<div class="empty">暂无播放记录</div>')+'</div>'+
 '<div class="sec"><h3>我收藏的</h3><span class="more">'+fav.length+' 首</span></div>'+
 '<div class="list">'+(fav.length?fav.slice(0,4).map(id=>{const s=findSong(id);return s?rowHtml(s,true):''}).join(''):'<div class="empty">还没有收藏歌曲<br>在歌曲右侧点心形试试</div>')+'</div>'+
 '<div class="sec"><h3>账号与数据</h3></div>'+
 '<div class="account-actions">'+
 '<button class="pill" onclick="editProfile()">编辑资料</button>'+
 '<button class="pill" onclick="changePwdForm()">修改密码</button>'+
 '<button class="pill" onclick="exportData()">导出数据</button>'+
 '<button class="pill" onclick="logout()">退出登录</button></div>'+
 '<div class="mine-note">账号 '+S.user.acc+' · 收藏、歌单和播放记录按账号隔离保存在本机。</div>'}
/* ================= 交互 ================= */
function playIt(id,fromQueue){if(!fromQueue)S.queue=null;S.playing=id;S.paused=false;S.pos=0;PLAYER._err=false;
 try{PLAYER.pause()}catch(e){}
 PLAYER.src='assets/audio/'+id+'.mp3';PLAYER.load();
 var pr=PLAYER.play();if(pr&&pr.catch)pr.catch(function(){toast('点一下播放按钮开始')});
 plays=[id].concat(plays.filter(x=>x!==id)).slice(0,40);save();
 go('player');toast('正在播放：'+findSong(id).t);syncMini()}
function togglePlay(){if(!S.playing){playIt('s1');return}S.paused=!S.paused;if(S.paused)PLAYER.pause();else PLAYER.play().catch(function(){});refreshPlayer();syncMini()}
function refreshPlayer(){syncMini();if(S.tab!=='player')return;const v=document.getElementById('view');
 const cur=v.scrollTop;v.innerHTML=vPlayer();v.scrollTop=cur;syncPlayer()}
function next(auto){if(S.repeat&&auto){S.pos=0;PLAYER.currentTime=0;PLAYER.play().catch(function(){});refreshPlayer();return}
 if(S.shuffle){const r=SONGS[Math.floor(Math.random()*SONGS.length)];playIt(r.id,true);return}
 if(S.queue&&S.queue.length){const i=S.queue.indexOf(S.playing);playIt(S.queue[(i+1)%S.queue.length],true);return}
 const i=SONGS.findIndex(s=>s.id===S.playing);playIt(SONGS[(i+1)%SONGS.length].id)}
function prev(){if(S.queue&&S.queue.length){const i=S.queue.indexOf(S.playing);playIt(S.queue[(i+S.queue.length-1)%S.queue.length],true);return}
 const i=SONGS.findIndex(s=>s.id===S.playing);playIt(SONGS[(i+SONGS.length-1)%SONGS.length].id)}
function toggleFav(id){fav=fav.includes(id)?fav.filter(x=>x!==id):[id].concat(fav);save();
 if(S.tab==='player')refreshPlayer();else go(S.tab);toast(fav.includes(id)?'已加入收藏':'已取消收藏')}
function clearPlays(){plays=[];save();go('mine');toast('播放记录已清空')}
function editProfile(){const u=S.user;
 openSheet('<h4>编辑资料</h4><label>昵称<input id="pfn" value="'+u.name+'" maxlength="10"></label>'+
 '<div class="acts"><button onclick="closeSheet()">取消</button><button class="ok" onclick="doEditProfile()">保存</button></div>')}
function doEditProfile(){const v=document.getElementById('pfn').value.trim();
 if(!v){toast('昵称不能为空');return}
 S.user.name=v;const u=users.find(x=>x.acc===S.user.acc);if(u)u.name=v;
 save();closeSheet();go('mine');toast('资料已更新')}
function changePwdForm(){openSheet('<h4>修改密码</h4><label>当前密码<input id="opp" type="password"></label>'+
 '<label>新密码<input id="npp" type="password" placeholder="6–16 位字母或数字"></label>'+
 '<div class="acts"><button onclick="closeSheet()">取消</button><button class="ok" onclick="doChangePwd()">更新</button></div>')}
function doChangePwd(){const o=document.getElementById('opp').value.trim(),n=document.getElementById('npp').value.trim();
 if(S.user.pwd!==o){toast('当前密码不正确');return}
 if(!/^[A-Za-z0-9]{6,16}$/.test(n)){toast('新密码为 6–16 位字母或数字');return}
 S.user.pwd=n;const u=users.find(x=>x.acc===S.user.acc);if(u)u.pwd=n;
 save();closeSheet();go('mine');toast('密码已更新')}
function exportData(){const data={acc:S.user.acc,name:S.user.name,fav:fav,plays:plays,lists:lists,exported:new Date().toISOString()};
 const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sonora_'+S.user.acc+'.json';
 document.body.appendChild(a);a.click();a.remove();toast('已导出我的收藏与歌单')}
function logout(){PLAYER.pause();document.getElementById('app').classList.add('hide');document.getElementById('login').classList.remove('hide');
 const v=document.querySelector('#login video');if(v){v.play().catch(()=>{})}drawCap()}
let timer=null;
function syncPlayer(){clearInterval(timer);timer=setInterval(tick,1000)}
function tick(){if(S.paused||!S.playing)return;const s=findSong(S.playing);
 if(!PLAYER._err&&!PLAYER.paused)S.pos=Math.min(s.len,Math.floor(PLAYER.currentTime));else if(PLAYER._err)S.pos=Math.min(s.len,S.pos+1);const f=document.getElementById('fill'),d=document.getElementById('pdot'),
 t=document.getElementById('tcur');
 if(!f){refreshPlayer();return}
 var mp=(S.pos/s.len*100)+'%';
 f.style.width=mp;if(d)d.style.left=mp;if(t)t.textContent=fmt(S.pos);
 var mf=document.getElementById('mfill');if(mf)mf.style.width=mp;
 if(S.sleepAt&&Date.now()>S.sleepAt){S.sleepAt=0;S.paused=true;refreshPlayer();toast('定时关闭 · 已暂停播放');return}
 if(S.pos>=s.len)next(true)}
function seek(e){const s=findSong(S.playing||'s1');const r=document.getElementById('bar').getBoundingClientRect();
 const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));S.pos=Math.round(p*s.len);PLAYER.currentTime=S.pos;refreshPlayer();toast('已跳转到 '+fmt(S.pos))}
function setVol(v){document.getElementById('volTxt').textContent=v;PLAYER.volume=v/100}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
 clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.remove('hide')}
function closeSheet(){document.getElementById('modal').classList.add('hide')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()});
